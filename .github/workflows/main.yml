name: build-malisx-pc

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Mesa
        run: |
          MESA_COMMIT=$(sed -n "s/^mesa_commit = '\(.*\)'/\1/p" meson.build)
          echo "Mesa commit: $MESA_COMMIT"
          git init mesa
          git -C mesa fetch --depth 1 https://github.com/bmdhacks/armsx2-turnip.git "$MESA_COMMIT"
          git -C mesa checkout FETCH_HEAD

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-dev clang python3-pip zip
          pip install --break-system-packages "meson>=1.7" mako pyyaml

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustc --version

      - name: Cache bindgen
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-0.71.1-${{ runner.os }}

      - name: Install bindgen 0.71.1
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli --version 0.71.1 --locked

      - name: Android NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          ls "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Configure
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          sed "s#^ndk = .*#ndk = '$ANDROID_HOME/ndk/$NDK_VERSION'#" cross/android-aarch64.ini > cross-ci.ini
          grep '^ndk' cross-ci.ini
          meson setup build-android --cross-file cross-ci.ini

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ninja -C build-android

      - name: Package flat driver zip
        run: |
          TC="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHA=$(git rev-parse --short=10 HEAD)
          PKG="malisx-pc-0.5.0-pc1-$SHA"
          mkdir -p out
          "$TC/llvm-strip" -o out/libvulkan_malisx2.so build-android/src/libvulkan_malisx2.so
          cat > out/meta.json <<EOT
          {
            "schemaVersion": 1,
            "name": "malisx-pc 0.5.0-pc1 ($SHA)",
            "description": "malisx2 fork for Mali-G52 (v7) PC/DXVK work: malisx-pc",
            "author": "malisx-pc (fork of malisx2 by bmdhacks)",
            "packageVersion": "0.5.0-pc1+$SHA",
            "vendor": "malisx-pc",
            "driverVersion": "44.1.0",
            "minApi": 29,
            "libraryName": "libvulkan_malisx2.so"
          }
          EOT
          sed -i 's/^ *//' out/meta.json
          (cd out && zip -9 "../$PKG.zip" libvulkan_malisx2.so meta.json)
          sha256sum "$PKG.zip" | tee "$PKG.zip.sha256"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Publish release (flat zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "$PKG.zip" "$PKG.zip.sha256" \
            --prerelease --title "malisx-pc build ${{ github.run_number }}" \
            --notes "Flat driver zip: install this file directly. Commit $GITHUB_SHA."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-workflow-artifact
          path: ${{ env.PKG }}.zip
