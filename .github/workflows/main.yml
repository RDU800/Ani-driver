name: build-malisx-pc

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply malisx-pc patch
        run: |
          python3 - <<'PY'
          import sys
          L = lambda *a: "\n".join(a)
          def fail(p):
              sys.exit("PATCH FAILED: expected text not found in " + p)

          p = "meson.build"
          s = open(p).read()
          if "0.5.0-pc1" in s:
              print("already applied:", p)
          else:
              old = "version : '0.5.0',"
              if old not in s:
                  fail(p)
              open(p, "w").write(s.replace(old, "version : '0.5.0-pc1',", 1))
              print("patched:", p)

          p = "src/vk/mali_memory.h"
          s = open(p).read()
          if "map_count" in s:
              print("already applied:", p)
          else:
              old = L("   void *map;", "", "   /* The range [lo, hi) ever mapped")
              new = L("   void *map;", "   /* vkMapMemory calls not yet matched by vkUnmapMemory (malisx-pc). */", "   uint32_t map_count;", "", "   /* The range [lo, hi) ever mapped")
              if old not in s:
                  fail(p)
              open(p, "w").write(s.replace(old, new, 1))
              print("patched:", p)

          p = "src/vk/mali_device_memory.c"
          s = open(p).read()
          if "malisx-pc: a nested" in s:
              print("already applied:", p)
          else:
              edits = [
                  (L("   if (mem->map)",
                     '      return vk_errorf(dev, VK_ERROR_MEMORY_MAP_FAILED, "memory is already mapped");'),
                   "   /* malisx-pc: a nested vkMapMemory is tolerated (see map_count). */"),
                  (L("      dmabuf_sync(mem, DMA_BUF_SYNC_START);",
                     "      base = mem->dmabuf_map;"),
                   L("      if (!mem->map)",
                     "         dmabuf_sync(mem, DMA_BUF_SYNC_START);",
                     "      base = mem->dmabuf_map;")),
                  (L("   mem->map = base + offset;",
                     "   if (mem->mapped_hi == mem->mapped_lo) {"),
                   L("   if (!mem->map)",
                     "      mem->map = base + offset;",
                     "   mem->map_count++;",
                     "   if (mem->mapped_hi == mem->mapped_lo) {")),
                  (L("   *ppData = mem->map;",
                     "   return VK_SUCCESS;"),
                   L("   *ppData = base + offset;",
                     "   return VK_SUCCESS;")),
                  (L("   if (!mem || !mem->map)",
                     "      return VK_SUCCESS;",
                     "   /* No cache maintenance."),
                   L("   if (!mem || !mem->map)",
                     "      return VK_SUCCESS;",
                     "   if (mem->map_count > 1) {",
                     "      mem->map_count--;",
                     "      return VK_SUCCESS;",
                     "   }",
                     "   mem->map_count = 0;",
                     "   /* No cache maintenance.")),
              ]
              for old, new in edits:
                  if old not in s:
                      fail(p)
                  s = s.replace(old, new, 1)
              open(p, "w").write(s)
              print("patched:", p)
          PY
          git diff --stat

      - name: Fetch pinned Mesa
        run: |
          MESA_COMMIT=$(sed -n "s/^mesa_commit = '\(.*\)'/\1/p" meson.build)
          echo "Mesa commit: $MESA_COMMIT"
          git init mesa
          git -C mesa fetch --depth 1 https://github.com/bmdhacks/armsx2-turnip.git "$MESA_COMMIT"
          git -C mesa checkout FETCH_HEAD

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-dev clang python3-pip zip
          pip install --break-system-packages "meson>=1.7" mako pyyaml

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustc --version

      - name: Cache bindgen
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-0.71.1-${{ runner.os }}

      - name: Install bindgen 0.71.1
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli --version 0.71.1 --locked

      - name: Android NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          ls "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Configure
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          sed "s#^ndk = .*#ndk = '$ANDROID_HOME/ndk/$NDK_VERSION'#" cross/android-aarch64.ini > cross-ci.ini
          grep '^ndk' cross-ci.ini
          meson setup build-android --cross-file cross-ci.ini

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ninja -C build-android

      - name: Package flat driver zips
        run: |
          TC="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHA=$(git rev-parse --short=10 HEAD)
          for V in main t2meta; do
            mkdir -p out-$V
            "$TC/llvm-strip" -o out-$V/libvulkan_panfrost.so build-android/src/libvulkan_malisx2.so
          done
          python3 - "$SHA" "${{ github.run_number }}" <<'PY'
          import json, sys
          sha, run = sys.argv[1], sys.argv[2]
          base = {
              "schemaVersion": 1,
              "vendor": "Mesa",
              "driverVersion": "Vulkan 1.1.366",
              "minApi": 31,
              "libraryName": "libvulkan_panfrost.so",
          }
          main = dict(base)
          main.update({
              "name": "malisx-pc 0.5.0-pc1 (" + sha + ")",
              "description": "malisx-pc: malisx2 fork for Mali-G52 (v7) PC/DXVK work.",
              "author": "malisx-pc (fork of malisx2 by bmdhacks)",
              "packageVersion": run,
          })
          json.dump(main, open("out-main/meta.json", "w"), indent=2)
          t2 = dict(base)
          t2.update({
              "driverVersion": "Vulkan 1.3.363",
              "name": "LOADER-TEST malisx2 lib",
              "description": "LOADER TEST ONLY: malisx2 library in Jim-style metadata",
              "author": "malisx-pc loader test",
              "packageVersion": "11",
          })
          json.dump(t2, open("out-t2meta/meta.json", "w"), indent=2)
          PY
          (cd out-main && zip -9 "../malisx-pc-0.5.0-pc1-$SHA.zip" libvulkan_panfrost.so meta.json)
          (cd out-t2meta && zip -9 "../malisx-pc-0.5.0-pc1-$SHA-t2meta.zip" libvulkan_panfrost.so meta.json)
          sha256sum malisx-pc-*.zip | tee SHA256SUMS.txt

      - name: Publish release (flat zips)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            malisx-pc-*.zip SHA256SUMS.txt \
            --prerelease --title "malisx-pc build ${{ github.run_number }}" \
            --notes "Install a flat zip directly. Main zip first; the t2meta zip is the fallback. Commit $GITHUB_SHA."
