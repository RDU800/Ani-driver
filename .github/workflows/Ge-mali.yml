name: Build Malisx PanVK (Vita3K / Mali-G52 Kbase)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Malisx / PanVK JM Kbase Mesa Fork URL'
        required: true
        default: 'https://github.com/bmdhacks/malisx2.git'
      source_ref:
        description: 'Branch, tag, or commit SHA'
        required: true
        default: 'main'
      driver_name:
        description: 'Display name in Winlator / Vita3K'
        required: true
        default: 'Malisx PanVK (Vita3K / Mali-G52)'
      driver_version:
        description: 'Driver version tag'
        required: true
        default: 'v0.2-vita-opt'
      build_type:
        description: 'Meson build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debugoptimized

env:
  NDK_VERSION: r27c
  ANDROID_API: 29

jobs:
  build-driver:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository (Patches & Configs)
        uses: actions/checkout@v4

      - name: Install System Dependencies & Up-to-date Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build python3-pip python3-mako python3-yaml python3-ply \
            clang llvm-18-dev libclang-18-dev spirv-tools glslang-tools \
            libdrm-dev libelf-dev flex bison zip unzip wget git pkg-config \
            patchelf rustc cargo
          pip3 install --upgrade pip
          pip3 install "meson>=1.7.0"
          rustup target add aarch64-linux-android

      - name: Download & Extract Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone Malisx / PanVK Source
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.source_ref || 'main' }}" \
            "${{ github.event.inputs.source_repo || 'https://github.com/bmdhacks/malisx2.git' }}" mesa-src

      - name: Apply Custom Patches (If Present)
        run: |
          if [ -d "patches" ] && [ -n "$(ls -A patches/*.patch 2>/dev/null)" ]; then
            echo "Applying custom patches..."
            cd mesa-src
            for p in ../patches/*.patch; do
              echo "Applying $p"
              git apply --whitespace=nowarn "$p"
            done
          else
            echo "No custom patches found in patches/ directory."
          fi

      - name: Build Host Panfrost Offline Shader Compiler (CLC)
        run: |
          meson setup build-host mesa-src \
            -Dplatforms= \
            -Dgallium-drivers=panfrost \
            -Dvulkan-drivers= \
            -Dtools=panfrost \
            -Dllvm=enabled
          ninja -C build-host src/panfrost/clc/panfrost_compile

      - name: Generate Android NDK Meson Cross-File with Vita3K / Mali-G52 Flags
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat << EOF > android-aarch64.txt
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          pkgconfig = 'pkg-config'

          [built-in options]
          c_args = [
            '-Wno-error=incompatible-function-pointer-types', 
            '-Wno-error=int-conversion', 
            '-DANDROID', 
            '-D__ANDROID_API__=${{ env.ANDROID_API }}',
            '-DPAN_FORCE_IDVS=1'
          ]
          cpp_args = [
            '-Wno-error=incompatible-function-pointer-types', 
            '-Wno-error=int-conversion', 
            '-DANDROID', 
            '-D__ANDROID_API__=${{ env.ANDROID_API }}',
            '-DPAN_FORCE_IDVS=1'
          ]
          c_link_args = ['-static-libstdc++', '-llog', '-ldl', '-lm', '-lc']
          cpp_link_args = ['-static-libstdc++', '-llog', '-ldl', '-lm', '-lc']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure PanVK for Android (mali_kbase)
        run: |
          export PATH="$PWD/build-host/src/panfrost/clc:$PATH"
          meson setup build-android mesa-src \
            --cross-file android-aarch64.txt \
            --buildtype=${{ github.event.inputs.build_type || 'release' }} \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${{ env.ANDROID_API }} \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dfreedreno-kmds= \
            -Dllvm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dopengl=false \
            -Dshared-glapi=disabled \
            -Dbuild-tests=false \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dlmsensors=disabled \
            -Dzstd=disabled

      - name: Compile Android Vulkan Driver (.so)
        run: |
          export PATH="$PWD/build-host/src/panfrost/clc:$PATH"
          ninja -C build-android src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Fix SONAME & Package Adrenotools ZIP
        run: |
          mkdir -p package
          cp build-android/src/panfrost/vulkan/libvulkan_panfrost.so package/vulkan.panvk.so
          patchelf --set-soname vulkan.panvk.so package/vulkan.panvk.so

          SHORT_SHA=$(cd mesa-src && git rev-parse --short HEAD)
          VER_TAG="${{ github.event.inputs.driver_version || 'v0.2-vita-opt' }}-${SHORT_SHA}"

          cat << EOF > package/meta.json
          {
            "schemaVersion": 1,
            "name": "${{ github.event.inputs.driver_name || 'Malisx PanVK (Vita3K / Mali-G52)' }}",
            "description": "Custom PanVK mali_kbase build optimized for Vita3K and Bifrost GPUs",
            "author": "${{ github.repository_owner }}",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "${VER_TAG}",
            "minApi": ${{ env.ANDROID_API }},
            "libraryName": "vulkan.panvk.so"
          }
          EOF

          ZIP_NAME="Malisx-PanVK-${VER_TAG}.zip"
          (cd package && zip -r "../${ZIP_NAME}" vulkan.panvk.so meta.json)
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Driver ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          
