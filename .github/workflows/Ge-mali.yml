name: Build Android Vulkan Driver (malisx2)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-0.71.1-Linux

      - name: Install Host Prerequisite Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build glslang-tools spirv-tools libclc-18-dev llvm-dev

      - name: Build, verify and publish
        run: python3 -u ani_ci.py
        env:
          DRIVER_NAME: ani-driver
          ZIP_SLUG: ani-driver
          BUILD_TYPE: release
          NDK_VERSION: 28.2.13676358
          FEATURES: map_fix,log_output,diag,float_controls,mirror_clamp,pipeline_cache_control
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
