name: build-malisx-pc

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358
  BUILD_NO: "${{ github.run_number }}"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 1 - nested vkMapMemory and dynamic build name
        run: |
          python3 - <<'PY'
          import os, sys
          L = lambda *a: "\n".join(a)
          def fail(p):
              sys.exit("PATCH FAILED: expected text not found in " + p)

          p = "meson.build"
          s = open(p).read()
          old = "version : '0.5.0',"
          if old not in s:
              fail(p)
          open(p, "w").write(s.replace(old, "version : 'pc-build-run" + os.environ["BUILD_NO"] + "',", 1))
          print("patched:", p)

          p = "src/vk/mali_memory.h"
          s = open(p).read()
          old = L("   void *map;", "", "   /* The range [lo, hi) ever mapped")
          new = L("   void *map;", "   /* vkMapMemory calls not yet matched by vkUnmapMemory (malisx pc). */", "   uint32_t map_count;", "", "   /* The range [lo, hi) ever mapped")
          if old not in s:
              fail(p)
          open(p, "w").write(s.replace(old, new, 1))
          print("patched:", p)

          p = "src/vk/mali_device_memory.c"
          s = open(p).read()
          edits = [
              (L("   if (mem->map)",
                 '      return vk_errorf(dev, VK_ERROR_MEMORY_MAP_FAILED, "memory is already mapped");'),
               "   /* malisx pc: a nested vkMapMemory is tolerated (see map_count). */"),
              (L("      dmabuf_sync(mem, DMA_BUF_SYNC_START);",
                 "      base = mem->dmabuf_map;"),
               L("      if (!mem->map)",
                 "         dmabuf_sync(mem, DMA_BUF_SYNC_START);",
                 "      base = mem->dmabuf_map;")),
              (L("   mem->map = base + offset;",
                 "   if (mem->mapped_hi == mem->mapped_lo) {"),
               L("   if (!mem->map)",
                 "      mem->map = base + offset;",
                 "   mem->map_count++;",
                 "   if (mem->mapped_hi == mem->mapped_lo) {")),
              (L("   *ppData = mem->map;",
                 "   return VK_SUCCESS;"),
               L("   *ppData = base + offset;",
                 "   return VK_SUCCESS;")),
              (L("   if (!mem || !mem->map)",
                 "      return VK_SUCCESS;",
                 "   /* No cache maintenance."),
               L("   if (!mem || !mem->map)",
                 "      return VK_SUCCESS;",
                 "   if (mem->map_count > 1) {",
                 "      mem->map_count--;",
                 "      return VK_SUCCESS;",
                 "   }",
                 "   mem->map_count = 0;",
                 "   /* No cache maintenance.")),
          ]
          for old, new in edits:
              if old not in s:
                  fail(p)
              s = s.replace(old, new, 1)
          open(p, "w").write(s)
          print("patched:", p)
          PY

      - name: Patch 2 - log file helper
        run: |
          python3 - <<'PY'
          import os, sys
          build = os.environ["BUILD_NO"]
          header = r'''/* malisx pc: file log and call trace. Header only. */
          #ifndef MALI_PC_TRACE_H
          #define MALI_PC_TRACE_H

          #include <stdarg.h>
          #include <stdio.h>
          #include <unistd.h>

          static inline void
          mali_pc_filelog(const char *line)
          {
             static const char *const paths[] = {
                "/sdcard/Download/malisx-pc.log",
                "/storage/emulated/0/Download/malisx-pc.log",
                "/data/local/tmp/malisx-pc.log",
             };
             for (unsigned i = 0; i < sizeof(paths) / sizeof(paths[0]); i++) {
                FILE *f = fopen(paths[i], "a");
                if (!f)
                   continue;
                fprintf(f, "[pid %d] %s\n", (int)getpid(), line);
                fclose(f);
                return;
             }
          }

          static inline void __attribute__((format(printf, 1, 2)))
          mali_pc_trace(const char *fmt, ...)
          {
             char buf[512];
             va_list ap;
             va_start(ap, fmt);
             vsnprintf(buf, sizeof(buf), fmt, ap);
             va_end(ap);
             mali_pc_filelog(buf);
          }

          #endif
          '''
          header = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in header.split("\n"))
          open("src/vk/mali_pc_trace.h", "w").write(header)

          p = "src/vk/mali_waist.c"
          s = open(p).read()
          marker = '#include "util/u_atomic.h"\n'
          if marker not in s:
              sys.exit("PATCH FAILED: marker not found in " + p)
          helper = r'''#include "mali_pc_trace.h"

          static void __attribute__((format(printf, 1, 2)))
          mali_pc_loge(const char *fmt, ...)
          {
             char buf[512];
             va_list ap;
             va_start(ap, fmt);
             vsnprintf(buf, sizeof(buf), fmt, ap);
             va_end(ap);
             mesa_loge("%s", buf);
             mali_pc_filelog(buf);
          }

          static void __attribute__((constructor))
          mali_pc_loaded(void)
          {
             char cmd[256] = "?";
             FILE *f = fopen("/proc/self/cmdline", "r");
             if (f) {
                size_t n = fread(cmd, 1, sizeof(cmd) - 1, f);
                cmd[n] = 0;
                fclose(f);
             }
             char line[400];
             snprintf(line, sizeof(line), "malisx pc build run-BUILDNO loaded in %s", cmd);
             mali_pc_filelog(line);
          }
          '''.replace("BUILDNO", build)
          helper = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in helper.split("\n"))
          head, tail = s.split(marker, 1)
          if tail.count("mesa_loge(") != 4:
              sys.exit("PATCH FAILED: expected 4 mesa_loge calls, found %d" % tail.count("mesa_loge("))
          tail = tail.replace("mesa_loge(", "mali_pc_loge(")
          open(p, "w").write(head + marker + helper + tail)
          print("patched:", p)
          PY

      - name: Patch 3 - call trace
        run: |
          python3 - <<'PY'
          import sys
          def fail(p):
              sys.exit("PATCH FAILED: expected text not found in " + p)
          def add_include(s, p):
              k = s.find('#include "')
              if k < 0:
                  fail(p)
              return s[:k] + '#include "mali_pc_trace.h"\n' + s[k:]

          # vkCreateInstance
          p = "src/vk/mali_instance.c"
          s = open(p).read()
          old = "VKAPI_ATTR VkResult VKAPI_CALL\nmali_CreateInstance(const VkInstanceCreateInfo *pCreateInfo,"
          new = "static VKAPI_ATTR VkResult VKAPI_CALL\nmali_CreateInstance_impl(const VkInstanceCreateInfo *pCreateInfo,"
          if old not in s:
              fail(p)
          s = add_include(s.replace(old, new, 1), p)
          s += r'''
          VKAPI_ATTR VkResult VKAPI_CALL
          mali_CreateInstance(const VkInstanceCreateInfo *pCreateInfo,
                              const VkAllocationCallbacks *pAllocator,
                              VkInstance *pInstance)
          {
             mali_pc_trace("vkCreateInstance: enter, apiVersion 0x%x, %u extensions",
                           pCreateInfo->pApplicationInfo ? pCreateInfo->pApplicationInfo->apiVersion : 0u,
                           pCreateInfo->enabledExtensionCount);
             for (uint32_t i = 0; i < pCreateInfo->enabledExtensionCount; i++)
                mali_pc_trace("  instance extension: %s", pCreateInfo->ppEnabledExtensionNames[i]);
             VkResult r = mali_CreateInstance_impl(pCreateInfo, pAllocator, pInstance);
             mali_pc_trace("vkCreateInstance: result %d", (int)r);
             return r;
          }
          '''.replace("\n          ", "\n")
          open(p, "w").write(s)
          print("patched:", p)

          # physical device enumeration
          p = "src/vk/mali_physical_device.c"
          s = open(p).read()
          edits = [
              ("   struct mali_instance *instance = container_of(vk_instance, struct mali_instance, vk);\n   const bool os_backend",
               "   struct mali_instance *instance = container_of(vk_instance, struct mali_instance, vk);\n   mali_pc_trace(\"enumerate physical devices: enter\");\n   const bool os_backend"),
              ("      VkResult result = physical_device_create(instance, path, &pdev);\n",
               "      VkResult result = physical_device_create(instance, path, &pdev);\n      mali_pc_trace(\"physical_device_create(%s) -> %d\", path, (int)result);\n"),
              ("   }\n   return VK_SUCCESS;\n}\n\nvoid\nmali_physical_device_destroy(",
               "   }\n   mali_pc_trace(\"enumerate physical devices: done\");\n   return VK_SUCCESS;\n}\n\nvoid\nmali_physical_device_destroy("),
          ]
          for old, new in edits:
              if old not in s:
                  fail(p)
              s = s.replace(old, new, 1)
          open(p, "w").write(add_include(s, p))
          print("patched:", p)

          # vkCreateDevice
          p = "src/vk/mali_device.c"
          s = open(p).read()
          old = "VKAPI_ATTR VkResult VKAPI_CALL\nmali_CreateDevice(VkPhysicalDevice physicalDevice,"
          new = "static VKAPI_ATTR VkResult VKAPI_CALL\nmali_CreateDevice_impl(VkPhysicalDevice physicalDevice,"
          if old not in s:
              fail(p)
          s = add_include(s.replace(old, new, 1), p)
          s += r'''
          VKAPI_ATTR VkResult VKAPI_CALL
          mali_CreateDevice(VkPhysicalDevice physicalDevice,
                            const VkDeviceCreateInfo *pCreateInfo,
                            const VkAllocationCallbacks *pAllocator,
                            VkDevice *pDevice)
          {
             mali_pc_trace("vkCreateDevice: enter, %u extensions", pCreateInfo->enabledExtensionCount);
             for (uint32_t i = 0; i < pCreateInfo->enabledExtensionCount; i++)
                mali_pc_trace("  device extension: %s", pCreateInfo->ppEnabledExtensionNames[i]);
             VkResult r = mali_CreateDevice_impl(physicalDevice, pCreateInfo, pAllocator, pDevice);
             mali_pc_trace("vkCreateDevice: result %d", (int)r);
             return r;
          }
          '''.replace("\n          ", "\n")
          open(p, "w").write(s)
          print("patched:", p)
          PY

      - name: Patch 4 - extensions
        run: |
          python3 - <<'PY'
          import sys
          p = "src/vk/mali_physical_device.c"
          s = open(p).read()
          edits = [
              ("static const struct vk_device_extension_table mali_device_extensions = {\n   .KHR_driver_properties = true,\n",
               "static const struct vk_device_extension_table mali_device_extensions = {\n   .KHR_driver_properties = true,\n   /* malisx pc: mirror-clamp is handled in mali_sampler.c; the divisor is\n    * applied by the v7 draw code (b->divisor). */\n   .KHR_sampler_mirror_clamp_to_edge = true,\n   .EXT_vertex_attribute_divisor = true,\n"),
              ("   *f = (struct vk_features) {\n",
               "   *f = (struct vk_features) {\n      /* malisx pc: VK_EXT_vertex_attribute_divisor. Zero divisor stays off. */\n      .vertexAttributeInstanceRateDivisor = true,\n      .vertexAttributeInstanceRateZeroDivisor = false,\n"),
              ("   *props = (struct vk_properties) {\n",
               "   *props = (struct vk_properties) {\n      .maxVertexAttribDivisor = 0xffffffffu,\n"),
          ]
          for old, new in edits:
              if s.count(old) != 1:
                  sys.exit("PATCH FAILED: anchor found %d times in %s:\n%s" % (s.count(old), p, old))
              s = s.replace(old, new, 1)
          open(p, "w").write(s)
          print("patched:", p)
          PY

      - name: Patch 5 - dynamic RAM/VRAM profiler and UMA heap sizing
        run: |
          python3 - <<'PY'
          import sys

          # 1. Create dynamic RAM/App detection header
          vram_header = r'''/* malisx pc: Boot-time RAM and Emulator App Profiler for Dynamic UMA VRAM sizing. */
          #ifndef MALI_PC_VRAM_H
          #define MALI_PC_VRAM_H

          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "mali_pc_trace.h"

          static uint64_t mali_pc_cached_vram_bytes = 0;

          static inline uint64_t
          mali_pc_get_total_ram_mb(void)
          {
             FILE *f = fopen("/proc/meminfo", "r");
             if (!f)
                return 8192;
             char line[256];
             uint64_t mem_kb = 0;
             while (fgets(line, sizeof(line), f)) {
                if (strncmp(line, "MemTotal:", 9) == 0) {
                   sscanf(line + 9, "%llu", (unsigned long long *)&mem_kb);
                   break;
                }
             }
             fclose(f);
             return mem_kb > 0 ? (mem_kb / 1024ULL) : 8192;
          }

          static inline uint64_t
          mali_pc_compute_vram_budget(void)
          {
             if (mali_pc_cached_vram_bytes > 0)
                return mali_pc_cached_vram_bytes;

             uint64_t ram_mb = mali_pc_get_total_ram_mb();
             char cmd[256] = {0};
             FILE *f = fopen("/proc/self/cmdline", "r");
             if (f) {
                size_t n = fread(cmd, 1, sizeof(cmd) - 1, f);
                for (size_t i = 0; i < n; i++) {
                   if (cmd[i] == '\0')
                      cmd[i] = ' ';
                }
                fclose(f);
             }

             bool is_vita = (strstr(cmd, "vita3k") != NULL || strstr(cmd, "Vita3K") != NULL);
             bool is_pc = (strstr(cmd, "winlator") != NULL || strstr(cmd, "wine") != NULL || strstr(cmd, "box64") != NULL);

             uint64_t vram_mb = 1024;
             const char *profile = "default";

             if (is_vita) {
                profile = "vita3k";
                if (ram_mb <= 4600)
                   vram_mb = 1350;      /* 4GB device: safe ceiling without OOM */
                else if (ram_mb <= 9000)
                   vram_mb = 3072;      /* 8GB device: dedicated 3.0GB UMA pool */
                else
                   vram_mb = 4608;      /* 12GB-16GB+ device: 4.5GB headroom */
             } else if (is_pc) {
                profile = "pc-translator";
                if (ram_mb <= 4600)
                   vram_mb = 1536;
                else if (ram_mb <= 9000)
                   vram_mb = 3584;      /* 8GB device: 3.5GB for DXVK/VKD3D */
                else
                   vram_mb = 5632;      /* 12GB-16GB+ device: 5.5GB pool */
             } else {
                if (ram_mb <= 4600)
                   vram_mb = 1024;
                else if (ram_mb <= 9000)
                   vram_mb = 2048;
                else
                   vram_mb = 3072;
             }

             mali_pc_cached_vram_bytes = vram_mb * 1024ULL * 1024ULL;
             mali_pc_trace("VRAM Profiler: RAM=%llu MB | Profile=%s | Dedicated UMA Heap=%llu MB",
                           (unsigned long long)ram_mb, profile, (unsigned long long)vram_mb);
             return mali_pc_cached_vram_bytes;
          }

          #endif
          '''
          vram_header = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in vram_header.split("\n"))
          open("src/vk/mali_pc_vram.h", "w").write(vram_header)

          # 2. Pre-warm the VRAM calculation at boot inside mali_waist.c constructor
          p_waist = "src/vk/mali_waist.c"
          s_waist = open(p_waist).read()
          target_ctor = 'snprintf(line, sizeof(line), "malisx pc build run-'
          if target_ctor not in s_waist:
              sys.exit("PATCH FAILED: constructor anchor not found in " + p_waist)
          s_waist = '#include "mali_pc_vram.h"\n' + s_waist.replace(
              target_ctor,
              'mali_pc_compute_vram_budget();\n   ' + target_ctor,
              1
          )
          open(p_waist, "w").write(s_waist)
          print("patched:", p_waist)

          # 3. Override physical device memory heap sizing in mali_physical_device.c
          p_pdev = "src/vk/mali_physical_device.c"
          s_pdev = open(p_pdev).read()
          s_pdev = '#include "mali_pc_vram.h"\n' + s_pdev

          old_mem_fn = "VKAPI_ATTR void VKAPI_CALL\nmali_GetPhysicalDeviceMemoryProperties2("
          new_mem_fn = "static VKAPI_ATTR void VKAPI_CALL\nmali_GetPhysicalDeviceMemoryProperties2_impl("
          if old_mem_fn not in s_pdev:
              sys.exit("PATCH FAILED: mali_GetPhysicalDeviceMemoryProperties2 not found in " + p_pdev)

          s_pdev = s_pdev.replace(old_mem_fn, new_mem_fn, 1)
          s_pdev += r'''
          VKAPI_ATTR void VKAPI_CALL
          mali_GetPhysicalDeviceMemoryProperties2(VkPhysicalDevice physicalDevice,
                                                  VkPhysicalDeviceMemoryProperties2 *pMemoryProperties)
          {
             mali_GetPhysicalDeviceMemoryProperties2_impl(physicalDevice, pMemoryProperties);
             uint64_t target_vram = mali_pc_compute_vram_budget();
             VkPhysicalDeviceMemoryProperties *props = &pMemoryProperties->memoryProperties;
             for (uint32_t i = 0; i < props->memoryHeapCount; i++) {
                if (props->memoryHeaps[i].flags & VK_MEMORY_HEAP_DEVICE_LOCAL_BIT) {
                   props->memoryHeaps[i].size = target_vram;
                }
             }
          }
          '''.replace("\n          ", "\n")

          open(p_pdev, "w").write(s_pdev)
          print("patched:", p_pdev)
          PY
          git status --short

      - name: Fetch pinned Mesa
        run: |
          MESA_COMMIT=$(sed -n "s/^mesa_commit = '\(.*\)'/\1/p" meson.build)
          echo "Mesa commit: $MESA_COMMIT"
          git init mesa
          git -C mesa fetch --depth 1 https://github.com/bmdhacks/armsx2-turnip.git "$MESA_COMMIT"
          git -C mesa checkout FETCH_HEAD

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-dev clang python3-pip zip
          pip install --break-system-packages "meson>=1.7" mako pyyaml

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustc --version

      - name: Cache bindgen
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-0.71.1-${{ runner.os }}

      - name: Install bindgen 0.71.1
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli --version 0.71.1 --locked

      - name: Android NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          ls "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Configure with Performance, FP16 & Geometry flags
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          sed "s#^ndk = .*#ndk = '$ANDROID_HOME/ndk/$NDK_VERSION'#" cross/android-aarch64.ini > cross-ci.ini
          
          # Safely append performance, FP16, and geometry flags to the cross-file using Python
          python3 -c "
          with open('cross-ci.ini', 'r') as f:
              content = f.read()
          
          flags = \"'-O3', '-DPAN_FORCE_IDVS=1', '-DPAN_FAST_VERTEX_CACHE=1', '-DPAN_PREFER_FP16=1'\"
          content = content.replace('c_args = [', 'c_args = [' + flags + ', ')
          content = content.replace('cpp_args = [', 'cpp_args = [' + flags + ', ')
          
          with open('cross-ci.ini', 'w') as f:
              f.write(content)
          "
          
          grep '^ndk' cross-ci.ini
      
